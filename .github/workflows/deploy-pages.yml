name: Deploy VOID website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Restore launcher download
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, glob, gzip, hashlib
          from pathlib import Path
          chunks = "".join(Path(part).read_text(encoding="ascii") for part in sorted(glob.glob("assets/launcher/VOID.exe.gz.b64.part-*")))
          launcher = gzip.decompress(base64.b64decode(chunks))
          assert hashlib.sha256(launcher).hexdigest().upper() == "62FF2B324DB1113AE05FA46F434E279C3D557AF1B4FF107E4E6316A7B2AAC5CC"
          Path("dist/download/VOID.exe").write_bytes(launcher)
          PY
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

