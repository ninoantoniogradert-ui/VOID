name: Deploy VOID website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "assets/installer/**"
      - "assets/launcher/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Restore verified VOID release files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, glob, gzip, hashlib
          from pathlib import Path

          def restore(pattern, destination, expected_hash):
              chunks = "".join(
                  Path(part).read_text(encoding="ascii")
                  for part in sorted(glob.glob(pattern))
              )
              payload = gzip.decompress(base64.b64decode(chunks))
              actual_hash = hashlib.sha256(payload).hexdigest().upper()
              assert actual_hash == expected_hash, f"hash mismatch for {destination}: {actual_hash}"
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)

          restore(
              "assets/installer/2.00/VOID-Setup.exe.gz.b64.part-*",
              "dist/download/VOID-Setup.exe",
              "A3034812152628AA7FCFA1720030C262621A046F8C71CEE70757726996C4B621",
          )
          restore(
              "assets/launcher/2.00/VOID.exe.gz.b64.part-*",
              "dist/download/VOID.exe",
              "10A6D7AE610E379FF471159562EE4195D12900F2253C6DAD2ED7B26C50605FE4",
          )
          PY
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
